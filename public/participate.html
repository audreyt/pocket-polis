<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>參與討論 — polis-serverless</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<main>
  <h1 id="conv-title">載入中⋯</h1>
  <p id="conv-description" class="muted"></p>
  <p id="load-error" class="error hidden"></p>

  <section id="vote-section" class="hidden">
    <div class="card statement-card"><span id="statement-text"></span></div>
    <div class="vote-buttons">
      <button type="button" class="agree" data-vote="1">同意</button>
      <button type="button" class="disagree" data-vote="-1">不同意</button>
      <button type="button" class="pass" data-vote="0">略過／不確定</button>
    </div>
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    <p class="muted"><span id="progress-text"></span>　·　投過的陳述不會再出現；每一票都會即時進入意見地圖。</p>
  </section>

  <section id="done-section" class="hidden">
    <div class="card">
      <p><strong>目前的陳述你都投完了。</strong></p>
      <p class="muted">有人提出新陳述時，回到這頁就能繼續投。</p>
      <div class="actions">
        <a id="report-link" class="button primary" href="#">看意見地圖與結果</a>
        <button type="button" id="check-again">看看有沒有新陳述</button>
      </div>
    </div>
  </section>

  <section id="submit-section" class="hidden">
    <h2>提出你自己的陳述</h2>
    <p class="muted">寫一句可以被「同意／不同意」的完整陳述（280 字內），一次一個想法，避免問句。</p>
    <div class="card">
      <textarea id="new-statement" rows="3" maxlength="280" placeholder="例：比起新功能，我們更該先把既有流程修穩。"></textarea>
      <div class="actions">
        <button type="button" class="primary" id="submit-statement">送出陳述</button>
      </div>
      <p id="submit-message" class="muted hidden"></p>
    </div>
  </section>

  <p class="muted" id="closed-note" style="display:none">這場討論已關閉，僅供瀏覽結果。</p>
</main>
<footer>
  <p>參與是匿名的：瀏覽器只保存一個隨機代號以避免重複計票。<a id="footer-report" href="#">結果頁</a> · <a href="https://github.com/mashbean/polis-serverless">原始碼</a></p>
</footer>
<script type="module" src="/js/participate.js"></script>
</body>
</html>
