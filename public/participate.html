<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>參與討論 — Pocket Polis</title>
  <meta property="og:title" content="參與討論 — Pocket Polis 口袋審議">
  <meta property="og:description" content="匿名投下你的同意或不同意，意見地圖即時更新。Vote anonymously and watch the opinion map update live.">
  <meta property="og:url" content="https://polis.tw/">
  <meta property="og:image" content="https://polis.tw/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<main class="narrow">
  <nav class="site-nav compact">
    <a class="wordmark" href="/" id="home-link"><img src="/logo.png" alt="Pocket Polis logo">Pocket Polis <span class="zh" data-i18n="nav.zhName">口袋審議</span></a>
    <span class="lang-switch" id="lang-switch"></span>
  </nav>
  <h1 id="conv-title" data-i18n="app.loading">載入中⋯</h1>
  <p id="conv-description" class="muted"></p>
  <p class="notice hidden" id="alt-banner"><a id="alt-link" href="#" data-i18n="app.altBanner">這場討論有另一個語言版本，點此前往</a> →</p>
  <p id="load-error" class="error hidden"></p>

  <section id="vote-section" class="hidden">
    <div class="card statement-card"><span id="statement-text"></span></div>
    <div class="vote-buttons">
      <button type="button" class="agree" data-vote="1" data-i18n="p.agree">同意</button>
      <button type="button" class="disagree" data-vote="-1" data-i18n="p.disagree">不同意</button>
      <button type="button" class="pass" data-vote="0" data-i18n="p.pass">略過／不確定</button>
    </div>
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    <p class="muted"><span id="progress-text"></span>　·　<span data-i18n="p.progressNote">投過的意見不會再出現；每一票都會即時更新意見地圖。</span></p>
  </section>

  <section id="done-section" class="hidden">
    <div class="card">
      <p><strong data-i18n="p.doneTitle">目前的意見你都投完了。</strong></p>
      <p class="muted" data-i18n="p.doneHint">有人提出新意見時，回到這頁就能繼續投。</p>
      <div class="actions">
        <a id="report-link" class="button primary" href="#" data-i18n="p.seeReport">看意見地圖與結果</a>
        <button type="button" id="check-again" data-i18n="p.checkAgain">看看有沒有新意見</button>
      </div>
    </div>
  </section>

  <section id="submit-section" class="hidden">
    <h2 data-i18n="p.submitTitle">提出你自己的意見</h2>
    <p class="muted" data-i18n="p.submitHint">寫一句大家可以「同意」或「不同意」的完整想法（280 字內）。一次一個想法，避免問句。</p>
    <div class="card">
      <textarea id="new-statement" rows="3" maxlength="280" data-i18n-placeholder="p.submitPlaceholder" placeholder="例：比起新計畫，我們更該先把現有的事情做穩。"></textarea>
      <div class="actions">
        <button type="button" class="primary" id="submit-statement" data-i18n="p.submitButton">送出意見</button>
      </div>
      <p id="submit-message" class="muted hidden"></p>
    </div>
  </section>

  <p class="muted hidden" id="closed-note" data-i18n="p.closed">這場討論已結束，結果仍然可以看。</p>
</main>
<footer>
  <div class="inner narrow">
  <p><span data-i18n="p.footerAnon">參與是匿名的：你的瀏覽器只保存一個隨機代號，用來避免重複計票。</span>
  <a id="footer-report" href="#" data-i18n="p.footerReport">結果頁</a> · <a href="https://github.com/mashbean/pocket-polis" data-i18n="app.sourceLink">原始碼</a></p>
  </div>
</footer>
<script type="module" src="/js/participate.js"></script>
</body>
</html>
