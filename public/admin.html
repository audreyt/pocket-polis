<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理 — Pocket Polis</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<main class="narrow">
  <nav class="site-nav compact">
    <a class="wordmark" href="/" id="home-link"><img src="/logo.png" alt="Pocket Polis logo">Pocket Polis <span class="zh" data-i18n="nav.zhName">口袋審議</span></a>
    <span class="lang-switch" id="lang-switch"></span>
  </nav>
  <h1 id="conv-title" data-i18n="a.title">管理頁</h1>
  <p id="load-error" class="error hidden"></p>

  <section id="token-section" class="card hidden">
    <p data-i18n="a.needToken">需要管理金鑰。請貼上建立討論時取得的管理連結或 32 碼金鑰：</p>
    <input type="text" id="token-input" data-i18n-placeholder="a.tokenPlaceholder" placeholder="管理連結或金鑰">
    <div class="actions"><button type="button" class="primary" id="token-save" data-i18n="a.enter">進入管理</button></div>
  </section>

  <div id="panel" class="hidden">
    <h2 data-i18n="a.shareTitle">分享連結</h2>
    <div class="card">
      <p><strong data-i18n="a.participateLink">參與連結</strong></p>
      <div class="link-row"><code id="participate-url"></code><button type="button" data-copy="participate-url" data-i18n="a.copy">複製</button></div>
      <p><strong data-i18n="a.reportLink">結果頁</strong></p>
      <div class="link-row"><code id="report-url"></code><button type="button" data-copy="report-url" data-i18n="a.copy">複製</button></div>
      <p><strong data-i18n="a.adminLink">管理連結（含金鑰，只給共同主持人）</strong></p>
      <div class="link-row"><code id="admin-url"></code><button type="button" data-copy="admin-url" data-i18n="a.copy">複製</button></div>
    </div>

    <h2 data-i18n="a.settingsTitle">設定</h2>
    <div class="card">
      <label class="checkbox-row"><input type="checkbox" id="setting-status"> <span data-i18n="a.settingOpen">開放投票中（取消勾選即結束討論）</span></label>
      <label class="checkbox-row"><input type="checkbox" id="setting-autoApprove"> <span data-i18n="a.settingAutoApprove">新意見直接公開（否則需你核准）</span></label>
      <label class="checkbox-row"><input type="checkbox" id="setting-allowSubmissions"> <span data-i18n="a.settingAllowSubmissions">開放參與者提出意見</span></label>
      <label class="checkbox-row"><input type="checkbox" id="setting-openData"> <span data-i18n="a.settingOpenData">公開資料下載（任何人可下載匿名化 CSV）</span></label>
      <label for="setting-altUrl" data-i18n="a.settingAltUrl">另一語言版本的連結（選填，會顯示在參與與結果頁）</label>
      <input type="text" id="setting-altUrl" placeholder="https://…">
      <p id="settings-message" class="muted hidden"></p>
    </div>

    <h2 id="pending-heading">待核准意見</h2>
    <div class="card" id="pending-container"></div>

    <h2 data-i18n="a.seedTitle">新增種子意見</h2>
    <div class="card">
      <textarea id="seed-text" rows="2" maxlength="280" data-i18n-placeholder="a.seedPlaceholder" placeholder="以主持人身分加入一句意見（直接公開）"></textarea>
      <div class="actions"><button type="button" class="primary" id="seed-add" data-i18n="a.seedAdd">加入</button></div>
    </div>

    <h2 data-i18n="a.allTitle">全部意見</h2>
    <div class="card" id="all-statements"></div>

    <h2 data-i18n="a.exportTitle">資料下載</h2>
    <div class="actions">
      <a class="button" id="export-comments" href="#" data-i18n="a.exportComments">下載 comments.csv（pol.is 格式）</a>
      <a class="button" id="export-statements" href="#" data-i18n="a.exportStatements">下載意見清單 CSV</a>
      <a class="button" id="export-votes" href="#" data-i18n="a.exportVotes">下載投票紀錄 CSV（匿名化）</a>
    </div>
    <p class="muted" data-i18n="a.exportNote">投票紀錄以 p1、p2⋯ 匿名化，可交給任何分析工具（例如 red-dwarf）交叉驗證。</p>
  </div>
</main>
<footer>
  <div class="inner narrow">
  <p><span data-i18n="a.footerNote">管理金鑰只存在此分頁的 sessionStorage，關閉分頁即清除。</span> <a href="https://github.com/mashbean/pocket-polis" data-i18n="app.sourceLink">原始碼</a></p>
  </div>
</footer>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
