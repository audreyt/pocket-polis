<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>結果 — Pocket Polis</title>
  <meta property="og:title" content="意見地圖 — Pocket Polis 口袋審議">
  <meta property="og:description" content="看看大家的意見分成幾群、哪裡其實有共識。See how opinions cluster and where the common ground is.">
  <meta property="og:url" content="https://polis.mashbean.net/">
  <meta property="og:image" content="https://polis.mashbean.net/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<main class="narrow">
  <nav class="site-nav compact">
    <a class="wordmark" href="/" id="home-link"><img src="/logo.png" alt="Pocket Polis logo">Pocket Polis <span class="zh" data-i18n="nav.zhName">口袋審議</span></a>
    <span class="lang-switch" id="lang-switch"></span>
  </nav>
  <h1 id="conv-title" data-i18n="app.loading">載入中⋯</h1>
  <p id="conv-description" class="muted"></p>
  <p id="load-error" class="error hidden"></p>

  <div class="stats-row" id="stats-row"></div>

  <h2 data-i18n="r.mapTitle">意見地圖</h2>
  <p class="muted" data-i18n="r.mapHint">每個點是一位參與者：投票越相似的人靠得越近，顏色代表想法相近的群。投票數還不夠的參與者暫時不會出現。</p>
  <div id="map-container"></div>
  <div class="legend" id="legend"></div>
  <p class="muted hidden" id="you-note" data-i18n="r.youNote">標著「你」的深色圓點，就是你的位置。</p>

  <h2 data-i18n="r.consensusTitle">跨群共識</h2>
  <p class="muted" data-i18n="r.consensusHint">每一群都傾向同一邊的意見，也就是立場不同的人仍然共享的看法。</p>
  <div class="card" id="consensus-container"></div>

  <h2 data-i18n="r.groupsTitle">各群最有代表性的意見</h2>
  <p class="muted" data-i18n="r.groupsHint">這些意見最能區分這個群和其他群（差異經過統計檢定確認）。</p>
  <div id="groups-container"></div>

  <h2 data-i18n="r.allTitle">全部意見</h2>
  <div class="card" id="statements-container"></div>

  <div class="actions">
    <a id="participate-link" class="button primary" href="#" data-i18n="r.participate">去投票</a>
    <button type="button" id="refresh" data-i18n="r.refresh">重新整理結果</button>
  </div>
  <p class="muted" id="computed-at"></p>
</main>
<footer>
  <div class="inner narrow">
  <p><a href="/guide#how-it-works" id="method-link" data-i18n="r.methodNote">分群方法說明</a> · <a href="https://github.com/mashbean/pocket-polis" data-i18n="app.sourceLink">原始碼</a></p>
  </div>
</footer>
<script type="module" src="/js/report.js"></script>
</body>
</html>
