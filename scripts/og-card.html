<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: "PingFang TC", "Noto Sans TC", -apple-system, sans-serif;
    background: #ffffff; color: #101828; position: relative;
  }
  .wash {
    position: absolute; right: -160px; top: -180px; width: 720px; height: 720px;
    background: radial-gradient(circle, rgba(79,70,229,0.10), rgba(13,148,136,0.05) 55%, transparent 70%);
  }
  .left { position: absolute; left: 84px; top: 96px; width: 500px; }
  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 44px; }
  .brand img { width: 76px; height: 76px; border-radius: 18px; }
  .brand .name { font-size: 44px; font-weight: 800; letter-spacing: -0.5px; }
  .brand .zh { font-size: 26px; color: #667085; font-weight: 500; margin-top: 4px; }
  h1 { font-size: 52px; line-height: 1.28; letter-spacing: -1px; font-weight: 800; margin-bottom: 26px; }
  h1 .grad {
    background: linear-gradient(100deg, #4f46e5, #0d9488);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline { font-size: 25px; color: #475467; line-height: 1.5; margin-bottom: 10px; }
  .tagline-en { font-size: 21px; color: #98a2b3; margin-bottom: 40px; }
  .pill {
    display: inline-block; font-size: 22px; font-weight: 600; color: #4f46e5;
    border: 2px solid #c7c4f4; border-radius: 999px; padding: 10px 26px; background: #f6f5ff;
  }
  .map {
    position: absolute; right: 64px; top: 88px; width: 470px; height: 454px;
    background: #ffffff; border: 1.5px solid #e6e8ee; border-radius: 22px;
    box-shadow: 0 24px 60px -18px rgba(16,24,40,0.18);
  }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="left">
    <div class="brand">
      <img src="logo-src.png" alt="">
      <div><div class="name">Pocket Polis</div><div class="zh">口袋審議</div></div>
    </div>
    <h1>把審議，<br><span class="grad">放進你的口袋</span></h1>
    <div class="tagline">讓你可以隨時發起審議的口袋工具</div>
    <div class="tagline-en">A pocket tool for deliberation, anytime.</div>
    <div class="pill">polis.mashbean.net</div>
  </div>
  <div class="map">

      <line x1="14" y1="168" x2="366" y2="168" stroke="#e6e8ee"/>
      <path d="M 54 168 Q 52 104 102 100 Q 150 98 152 158 Q 156 224 106 238 Q 58 240 54 168 Z" fill="#c9793d" fill-opacity="0.16" filter="url(#b)"/>
      <path d="M 224 164 Q 226 94 280 92 Q 334 94 336 162 Q 336 230 282 238 Q 226 236 224 164 Z" fill="#4f6fb5" fill-opacity="0.16" filter="url(#b)"/>

        <circle cx="78" cy="120" r="6"/><circle cx="112" cy="112" r="6"/><circle cx="64" cy="146" r="6"/>
        <circle cx="92" cy="142" r="6"/><circle cx="126" cy="136" r="6"/><circle cx="72" cy="174" r="6"/>
        <circle cx="104" cy="168" r="6"/><circle cx="134" cy="166" r="6"/><circle cx="84" cy="198" r="6"/>
        <circle cx="116" cy="194" r="6"/><circle cx="70" cy="216" r="6"/><circle cx="100" cy="222" r="6"/>
        <circle cx="128" cy="208" r="6"/>

        <circle cx="238" cy="140" r="6"/><circle cx="268" cy="134" r="6"/><circle cx="298" cy="138" r="6"/>
        <circle cx="326" cy="152" r="6"/><circle cx="246" cy="166" r="6"/><circle cx="278" cy="162" r="6"/>
        <circle cx="308" cy="170" r="6"/><circle cx="236" cy="192" r="6"/><circle cx="264" cy="188" r="6"/>
        <circle cx="296" cy="196" r="6"/><circle cx="322" cy="184" r="6"/><circle cx="276" cy="216" r="6"/>
      </g>
      <rect x="66" y="58" width="68" height="24" rx="12" fill="#c9793d" fill-opacity="0.12"/>

      <rect x="244" y="58" width="68" height="24" rx="12" fill="#4f6fb5" fill-opacity="0.12"/>
      <text x="278" y="75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4f6fb5">A 群 · 47</text>
      <rect x="154" y="106" width="30" height="20" rx="10" fill="#101828"/>
      <text x="169" y="120.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">你</text>
      <circle cx="169" cy="142" r="10" fill="none" stroke="#101828" stroke-opacity="0.3" stroke-width="1.6"/>
      <circle cx="169" cy="142" r="5.5" fill="#101828" stroke="#fff" stroke-width="2"/>
      <rect x="30" y="262" width="320" height="46" rx="11" fill="#f8f9fb" stroke="#e6e8ee"/>

      <rect x="276" y="273" width="62" height="22" rx="11" fill="#15803d" fill-opacity="0.1" stroke="#15803d"/>

    </svg>
  </div>
</body>
</html>
